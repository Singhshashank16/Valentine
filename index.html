<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Be My Valentine 💖</title>

  <style>
    body {
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }
    .card {
      background: white;
      padding: 40px 30px;
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      width: 340px;
    }
    h1 {
      color: #e63946;
      margin-bottom: 30px;
      font-size: 22px;
    }
    .buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 30px;
      gap: 20px;
    }
    button {
      flex: 1;
      padding: 14px 0;
      font-size: 18px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      transition: all 0.35s ease;
    }
    #yes { background: #e63946; color: white; }
    #no { background: #adb5bd; color: #333; }

    .sunflower {
      position: fixed;
      bottom: -30px;
      font-size: 28px;
      animation: floatUp 5s linear infinite;
      pointer-events: none;
    }
    @keyframes floatUp {
      from { transform: translateY(0) scale(1); opacity: 1; }
      to { transform: translateY(-110vh) scale(1.4); opacity: 0; }
    }
  </style>
</head>
<body>

  <audio id="music" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_4c6b48bfb1.mp3?filename=lovely-piano-112191.mp3" type="audio/mpeg">
  </audio>

  <div class="card" id="card">
    <h1>Paaky! Will you be my Valentine ? 💖</h1>
    <div class="buttons">
      <button id="yes">Yes 🌻</button>
      <button id="no">No 🙃</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const music = document.getElementById("music");
    const card = document.getElementById("card");

    let noClicks = 0;
    const noTexts = [
      "Are you sure? 😶",
      "Really sure? 😐",
      "Think again 🥺"
    ];

    noBtn.addEventListener("click", () => {
      noClicks++;
      if (noClicks <= 3) {
        noBtn.textContent = noTexts[noClicks - 1];
        noBtn.style.transform = `scale(${1 - noClicks * 0.2})`;
        noBtn.style.opacity = `${1 - noClicks * 0.3}`;
      }
      if (noClicks === 3) {
        setTimeout(() => noBtn.style.display = "none", 300);
      }
    });

    yesBtn.addEventListener("click", () => {
      music.play();

      document.body.innerHTML = `
        <div style="
          height:100vh; display:flex; align-items:center; justify-content:center;
          background:#000; font-family:Segoe UI; color:white; text-align:center;
          flex-direction:column;
        ">
          <div style="font-size:26px; margin-bottom:20px;">
            <strong>Shukriya! Your choice matters! 💛</strong>
          </div>
          <img src="https://media.giphy.com/media/111ebonMs90YLu/giphy.gif" 
               alt="Yes celebration" 
               style="max-width:80%; border-radius:20px; box-shadow: 0 10px 30px rgba(0,0,0,0.4);" />
        </div>
      `;

      setTimeout(() => {
        document.body.innerHTML = `
          <div style="
            height:100vh; display:flex; align-items:center; justify-content:center;
            background:linear-gradient(135deg,#ffdde1,#ee9ca7);
            font-family:Segoe UI; color:white; text-align:center; padding:20px;
          ">
            <h1>🌻 Yayyy! 🌻</h1>
          </div>
        `;
        setInterval(() => {
          const f = document.createElement("div");
          f.innerText = "🌻";
          f.style.position = "fixed";
          f.style.bottom = "-30px";
          f.style.left = Math.random() * 100 + "vw";
          f.style.fontSize = (24 + Math.random() * 18) + "px";
          f.style.animation = "floatUp 5s linear infinite";
          document.body.appendChild(f);
          setTimeout(() => f.remove(), 7000);
        }, 300);
      }, 2800);

    });
  </script>

</body>
</html>

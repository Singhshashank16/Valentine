<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Be My Valentine 💖</title>

  <style>
    body {
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }

    .card {
      background: white;
      padding: 40px 30px;
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      width: 340px;
    }

    h1 {
      color: #e63946;
      margin-bottom: 30px;
      font-size: 22px;
    }

    .buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 30px;
      gap: 20px;
    }

    button {
      flex: 1;
      padding: 14px 0;
      font-size: 18px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      transition: all 0.35s ease;
    }

    #yes {
      background: #e63946;
      color: white;
    }

    #no {
      background: #adb5bd;
      color: #333;
    }

    /* Sunflowers */
    .sunflower {
      position: fixed;
      bottom: -30px;
      font-size: 28px;
      animation: floatUp 5s linear infinite;
      pointer-events: none;
    }

    @keyframes floatUp {
      from {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      to {
        transform: translateY(-110vh) scale(1.4);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Background Music -->
  <audio id="music" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_4c6b48bfb1.mp3?filename=lovely-piano-112191.mp3" type="audio/mpeg">
  </audio>

  <div class="card" id="card">
    <h1>Paaky! Will you be my Valentine ? 💖</h1>

    <div class="buttons">
      <button id="yes">Yes 🌻</button>
      <button id="no">No 🙃</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const music = document.getElementById("music");
    const card = document.getElementById("card");

    let noClicks = 0;

    const noTexts = [
      "Are you sure? 😶",
      "Really sure? 😐",
      "Think again 🥺"
    ];

    noBtn.addEventListener("click", () => {
      noClicks++;

      if (noClicks <= 3) {
        noBtn.textContent = noTexts[noClicks - 1];
        noBtn.style.transform = `scale(${1 - noClicks * 0.2})`;
        noBtn.style.opacity = `${1 - noClicks * 0.3}`;
      }

      if (noClicks === 3) {
        setTimeout(() => {
          noBtn.style.display = "none";
        }, 300);
      }
    });

    yesBtn.addEventListener("click", () => {
      music.play();

      // Sunflower rain 🌻
      setInterval(() => {
        const flower = document.createElement("div");
        flower.className = "sunflower";
        flower.innerText = "🌻";
        flower.style.left = Math.random() * 100 + "vw";
        flower.style.fontSize = (24 + Math.random() * 18) + "px";
        flower.style.animationDuration = (3 + Math.random() * 3) + "s";
        document.body.appendChild(flower);
        setTimeout(() => flower.remove(), 7000);
      }, 300);

      card.innerHTML = `
        <h1 style="font-size:24px;">
          🌻<br>
          Shukriya!<br>
          <strong>Your free will matters!</strong> 💛
          <strong>You are officially Shashank's Valentine</strong>
        </h1>
      `;
    });
  </script>

</body>
</html>

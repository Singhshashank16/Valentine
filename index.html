<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Be My Valentine 💖</title>

  <style>
    body {
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }

    .card {
      background: white;
      padding: 40px 30px;
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      width: 340px;
      z-index: 1;
    }

    h1 {
      color: #e63946;
      margin-bottom: 30px;
      font-size: 22px;
    }

    .buttons {
      display: flex;
      gap: 20px;
    }

    button {
      flex: 1;
      padding: 14px 0;
      font-size: 18px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      transition: all 0.4s ease;
    }

    #yes { background: #e63946; color: white; }
    #no { background: #adb5bd; color: #333; }

    /* Overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: #000;
      color: white;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 22px;
      padding: 20px;
      z-index: 10;

      /* 🔥 CRITICAL FIX */
      pointer-events: none;
    }

    .overlay.show {
      display: flex;
      pointer-events: auto;
    }

    .overlay img {
      max-width: 85%;
      border-radius: 18px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .sunflower {
      position: fixed;
      bottom: -30px;
      font-size: 28px;
      animation: floatUp 5s linear infinite;
      pointer-events: none;
      z-index: 5;
    }

    @keyframes floatUp {
      from { transform: translateY(0) scale(1); opacity: 1; }
      to { transform: translateY(-110vh) scale(1.4); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Audio -->
  <audio id="music" loop preload="auto">
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_4c6b48bfb1.mp3?filename=lovely-piano-112191.mp3" type="audio/mpeg">
  </audio>

  <!-- Main card -->
  <div class="card" id="card">
    <h1>Paaky! Will you be my Valentine ? 💖</h1>
    <div class="buttons">
      <button id="yes">Yes 🌻</button>
      <button id="no">No 🙃</button>
    </div>
  </div>

  <!-- Overlay -->
  <div class="overlay" id="overlay"></div>

  <script>
    const yesBtn = document.getElementById("yes");
    const noBtn = document.getElementById("no");
    const overlay = document.getElementById("overlay");
    const card = document.getElementById("card");
    const music = document.getElementById("music");

    /* NO CLICK */
    noBtn.onclick = () => {
      noBtn.style.opacity = "0";
      noBtn.style.transform = "scale(0.6)";
      noBtn.style.pointerEvents = "none";

      overlay.classList.add("show");
      overlay.innerHTML = `
        <strong>
          Just like your PF withdrawal is rejected,<br>
          we will reject your No 😌
        </strong>
      `;

      setTimeout(() => {
        overlay.classList.remove("show");
        noBtn.style.display = "none";
      }, 5000);
    };

    /* YES CLICK — NOW 100% WORKING */
    yesBtn.onclick = () => {
      // 🔊 Play music (mobile-safe)
      music.currentTime = 0;
      music.play().catch(() => {});

      overlay.classList.add("show");
      overlay.innerHTML = `
        <strong>Shukriya!<br>Your choice matters! 💛</strong>
      `;

      // Show meme
      setTimeout(() => {
        overlay.innerHTML = `
          <img src="https://i.imgur.com/l9NwyiI.gif" alt="When she says yes" />
        `;
      }, 1200);

      // After 5 seconds → celebration
      setTimeout(() => {
        overlay.classList.remove("show");
        card.style.display = "none";

        setInterval(() => {
          const f = document.createElement("div");
          f.className = "sunflower";
          f.innerText = "🌻";
          f.style.left = Math.random() * 100 + "vw";
          f.style.fontSize = (24 + Math.random() * 18) + "px";
          document.body.appendChild(f);
          setTimeout(() => f.remove(), 7000);
        }, 300);
      }, 6200);
    };
  </script>

</body>
</html>

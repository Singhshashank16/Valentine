<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Be My Valentine 💖</title>

  <style>
    body {
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }

    .card {
      background: white;
      padding: 40px 30px;
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      width: 340px;
    }

    h1 {
      color: #e63946;
      margin-bottom: 30px;
      font-size: 22px;
    }

    .buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 30px;
      gap: 20px;
    }

    button {
      flex: 1;
      padding: 14px 0;
      font-size: 18px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      transition: all 0.4s ease;
    }

    #yes {
      background: #e63946;
      color: white;
    }

    #no {
      background: #adb5bd;
      color: #333;
    }

    /* Flash screen */
    .flash {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: white;
      text-align: center;
      font-size: 22px;
      padding: 20px;
    }

    /* Sunflowers */
    .sunflower {
      position: fixed;
      bottom: -30px;
      font-size: 28px;
      animation: floatUp 5s linear infinite;
      pointer-events: none;
    }

    @keyframes floatUp {
      from {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      to {
        transform: translateY(-110vh) scale(1.4);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Background Music -->
  <audio id="music" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_4c6b48bfb1.mp3?filename=lovely-piano-112191.mp3" type="audio/mpeg">
  </audio>

  <div class="card" id="card">
    <h1>Paaky! Will you be my Valentine ? 💖</h1>

    <div class="buttons">
      <button id="yes">Yes 🌻</button>
      <button id="no">No 🙃</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const card = document.getElementById("card");
    const music = document.getElementById("music");

    /* NO clicked — one time drama */
    noBtn.addEventListener("click", () => {
      // Fade NO immediately
      noBtn.style.opacity = "0";
      noBtn.style.transform = "scale(0.6)";
      noBtn.style.pointerEvents = "none";

      // Flash message
      setTimeout(() => {
        document.body.innerHTML = `
          <div class="flash">
            <strong>
              Just like your PF withdrawal is rejected,<br>
              we will reject your No 😌
            </strong>
          </div>
        `;
      }, 300);

      // Bring back card with ONLY YES
      setTimeout(() => {
        document.body.innerHTML = "";
        document.body.appendChild(card);
        noBtn.style.display = "none";
      }, 1600);
    });

    /* YES clicked */
    yesBtn.addEventListener("click", () => {
      music.play();

      // Flash gratitude
      document.body.innerHTML = `
        <div class="flash">
          <strong>Shukriya!<br>Your choice matters! 💛</strong>
        </div>
      `;

      // Meme screen
      setTimeout(() => {
        document.body.innerHTML = `
          <div style="
            height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#111;
            padding:20px;
          ">
            <img 
              src="https://i.imgur.com/l9NwyiI.gif"
              alt="When she says yes"
              style="
                max-width:85%;
                border-radius:18px;
                box-shadow:0 20px 40px rgba(0,0,0,0.5);
              "
            />
          </div>
        `;
      }, 1200);

      // Final sunflower celebration
      setTimeout(() => {
        document.body.innerHTML = `
          <div style="
            height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:linear-gradient(135deg,#ffdde1,#ee9ca7);
            font-family:Segoe UI;
            color:white;
            text-align:center;
            padding:20px;
          ">
            <h1>🌻 Yayyy! 🌻</h1>
          </div>
        `;

        setInterval(() => {
          const f = document.createElement("div");
          f.className = "sunflower";
          f.innerText = "🌻";
          f.style.left = Math.random() * 100 + "vw";
          f.style.fontSize = (24 + Math.random() * 18) + "px";
          f.style.animationDuration = (3 + Math.random() * 3) + "s";
          document.body.appendChild(f);
          setTimeout(() => f.remove(), 7000);
        }, 300);
      }, 3200);
    });
  </script>

</body>
</html>

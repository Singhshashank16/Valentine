<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Be My Valentine 💖</title>

  <style>
    body {
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: white;
      padding: 40px 30px;
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      width: 340px;
    }

    h1 {
      color: #e63946;
      margin-bottom: 30px;
      font-size: 22px;
    }

    .buttons {
      display: flex;
      gap: 20px;
    }

    button {
      flex: 1;
      padding: 14px 0;
      font-size: 18px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      transition: all 0.4s ease;
    }

    #yes { background: #e63946; color: white; }
    #no { background: #adb5bd; color: #333; }

    .flash {
      height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: white;
      text-align: center;
      font-size: 22px;
      padding: 20px;
    }

    .sunflower {
      position: fixed;
      bottom: -30px;
      font-size: 28px;
      animation: floatUp 5s linear infinite;
      pointer-events: none;
    }

    @keyframes floatUp {
      from { transform: translateY(0) scale(1); opacity: 1; }
      to { transform: translateY(-110vh) scale(1.4); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Audio stays alive always -->
  <audio id="music" loop preload="auto">
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_4c6b48bfb1.mp3?filename=lovely-piano-112191.mp3" type="audio/mpeg">
  </audio>

  <div id="app">
    <div class="card" id="card">
      <h1>Paaky! Will you be my Valentine ? 💖</h1>
      <div class="buttons">
        <button id="yes">Yes 🌻</button>
        <button id="no">No 🙃</button>
      </div>
    </div>
  </div>

  <script>
    const app = document.getElementById("app");
    const card = document.getElementById("card");
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const music = document.getElementById("music");

    /* NO CLICK */
    noBtn.addEventListener("click", () => {
      noBtn.style.opacity = "0";
      noBtn.style.transform = "scale(0.6)";
      noBtn.style.pointerEvents = "none";

      setTimeout(() => {
        app.innerHTML = `
          <div class="flash">
            <strong>
              Just like your PF withdrawal is rejected,<br>
              we will reject your No 😌
            </strong>
          </div>
        `;
      }, 300);

      // Flash for 5 seconds
      setTimeout(() => {
        app.innerHTML = "";
        app.appendChild(card);
        noBtn.style.display = "none";
      }, 5300);
    });

    /* YES CLICK */
    yesBtn.addEventListener("click", async () => {
      // Start music safely
      try { await music.play(); } catch (e) {}

      // Gratitude flash
      app.innerHTML = `
        <div class="flash">
          <strong>Shukriya!<br>Your choice matters! 💛</strong>
        </div>
      `;

      // Show meme
      setTimeout(() => {
        app.innerHTML = `
          <div style="
            height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#111;
            padding:20px;
          ">
            <img 
              src="https://i.imgur.com/l9NwyiI.gif"
              alt="When she says yes"
              style="
                max-width:85%;
                border-radius:18px;
                box-shadow:0 20px 40px rgba(0,0,0,0.5);
              "
            />
          </div>
        `;
      }, 1200);

      // Meme visible for 5 seconds
      setTimeout(() => {
        app.innerHTML = `
          <div style="
            height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:linear-gradient(135deg,#ffdde1,#ee9ca7);
            font-family:Segoe UI;
            color:white;
            text-align:center;
            padding:20px;
          ">
            <h1>🌻 Yayyy! 🌻</h1>
          </div>
        `;

        setInterval(() => {
          const f = document.createElement("div");
          f.className = "sunflower";
          f.innerText = "🌻";
          f.style.left = Math.random() * 100 + "vw";
          f.style.fontSize = (24 + Math.random() * 18) + "px";
          document.body.appendChild(f);
          setTimeout(() => f.remove(), 7000);
        }, 300);
      }, 6200);
    });
  </script>

</body>
</html>
